# Releases the publisher clients when a tag v<version> is pushed, e.g. v0.2.0. Both clients get
# the version from the tag. A version with -SNAPSHOT fails.
#
#   - the Gradle settings plugin com.telesphorepo.publish (gradle), with its plugin marker, to
#     the Gradle Plugin Portal and to the owner's Nexus
#   - com.telesphorepo:telesphorepo-maven-extension and telesphorepo-maven-plugin (maven), with
#     their client library and parent pom, to Maven Central and to the owner's Nexus
#
# Environment "Nexus":
#   NEXUS_USERNAME          Variable: user that may deploy to NEXUS_MAVEN_URL below.
#   NEXUS_PASSWORD          Secret: password (or user token) of that user.
# Environment "PluginPortal":
#   GRADLE_PUBLISH_KEY      Secret: API key of the Gradle Plugin Portal account.
#   GRADLE_PUBLISH_SECRET   Secret: the secret of that API key.
#   GPG_PRIVATE_KEY         Secret: ASCII-armored private key that signs the artifacts.
#   GPG_PASSPHRASE          Secret: the passphrase of that key.
# Environment "Central":
#   CENTRAL_TOKEN_USERNAME  Secret: user token name of central.sonatype.com. The namespace
#                           com.telesphorepo must be verified on that account.
#   CENTRAL_TOKEN_PASSWORD  Secret: user token password.
#   GPG_PRIVATE_KEY         Secret: the same signing key as above. Central checks the signatures
#                           against the public key on a keyserver.
#   GPG_PASSPHRASE          Secret: the passphrase of that key.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  NEXUS_MAVEN_URL: https://nexus.telesphoreo.me/repository/gradle-plugins-releases/

jobs:
  gradle-plugin:
    name: Gradle plugin to Nexus
    environment: Nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish
        working-directory: gradle
        env:
          # build.gradle.kts adds the maven-publish repository "release" from NEXUS_MAVEN_URL
          # and these variables.
          NEXUS_USERNAME: ${{ vars.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ""|*-SNAPSHOT) echo "Tag $GITHUB_REF_NAME has no final version"; exit 1 ;;
          esac
          # Publishes the plugin jar and the plugin marker com.telesphorepo.publish.gradle.plugin.
          ./gradlew --no-daemon --console=plain publishAllPublicationsToReleaseRepository -Pversion="$version"

  gradle-plugin-portal:
    name: Gradle plugin to the Plugin Portal
    environment: PluginPortal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish
        working-directory: gradle
        env:
          # The plugin-publish plugin reads the Portal API key from these variables.
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
          # build.gradle.kts signs with the Gradle properties signingKey and signingPassword.
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ""|*-SNAPSHOT) echo "Tag $GITHUB_REF_NAME has no final version"; exit 1 ;;
          esac
          ./gradlew --no-daemon --console=plain publishPlugins -Pversion="$version"

  maven-extension:
    name: Maven extension and plugin to Nexus
    environment: Nexus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Writes ~/.m2/settings.xml with the server "release". The deploy step below
          # reads the credentials from these variables.
          server-id: release
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD
      - name: Set the version from the tag
        working-directory: maven
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ""|*-SNAPSHOT) echo "Tag $GITHUB_REF_NAME has no final version"; exit 1 ;;
          esac
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Deploy
        working-directory: maven
        env:
          NEXUS_USERNAME: ${{ vars.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: ./mvnw -B -ntp deploy -DaltDeploymentRepository="release::${NEXUS_MAVEN_URL}"

  maven-central:
    name: Maven extension and plugin to Maven Central
    environment: Central
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          # Writes ~/.m2/settings.xml with the server "central", the publishingServerId of
          # central-publishing-maven-plugin.
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Set the version from the tag
        working-directory: maven
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            ""|*-SNAPSHOT) echo "Tag $GITHUB_REF_NAME has no final version"; exit 1 ;;
          esac
          ./mvnw -B -ntp org.codehaus.mojo:versions-maven-plugin:2.18.0:set -DnewVersion="$version" -DgenerateBackupPoms=false
      - name: Publish
        working-directory: maven
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          # The Bouncy Castle signer of maven-gpg-plugin reads the key and its passphrase from
          # these variables, so the job needs no gpg keyring.
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        # The release profile adds sources, javadoc and signatures, and uploads through
        # central-publishing-maven-plugin, which waits until Central has published the release.
        run: ./mvnw -B -ntp -P release deploy -Dgpg.signer=bc
